name: Testes Show do Milhao
on:
  pull_request:
  push:
    branches:
      - main
      - feature/supabase-ajudas
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Testar regras do jogo
        run: python -m unittest discover -s tests -v
